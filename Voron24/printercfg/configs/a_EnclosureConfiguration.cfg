#####################################################################
#####################################################################
# Enclosure Configuration
#####################################################################
#####################################################################

#####################################################################
#   Chamber Temperature
#####################################################################

[temperature_sensor chamber]
sensor_pin: PF4
sensor_type: EPCOS 100K B57560G104F

[temperature_sensor ChamberGantry]
sensor_pin: PF5
sensor_type: Generic 3950

[temperature_fan ChamberExhaust]
pin: PE5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF4
control: pid
target_temp: 55
min_temp: 0
max_temp: 90
min_speed: 0
max_speed: 1
kick_start_time: 0.5
cycle_time: 0.05          
pid_Kp: 3.5
pid_Ki: 0.20
pid_Kd: 2.0



#####################################################################
#   Chamber Lighting
#####################################################################

[output_pin Caselight]
pin: PB10
pwm:true
shutdown_value: 0
value:1
cycle_time: 0.001

#####################################################################
#   Electrical Area Fan Blow IN
#####################################################################

[temperature_fan switchboard_Blow_IN]
pin: PD14
kick_start_time: 0.5
max_power: 1.0
sensor_pin: PF6
sensor_type: Generic 3950
target_temp: 30
max_delta: 1
min_temp: 1
max_temp: 200
control: watermark
max_speed: 1

#####################################################################
#   Electrical Area Fan Blow OUT
#####################################################################

[temperature_fan switchboard_Blow_OUT]
pin: PD15
kick_start_time: 0.5
max_power: 1.0
sensor_pin: PF6
sensor_type: Generic 3950
target_temp: 35
max_delta: 1
min_temp: 1
max_temp: 200
control: watermark
max_speed: 1

#####################################################################
#   Electrical Area Stepper Cooling
#####################################################################

[controller_fan stepper_fan]
pin: PD13
kick_start_time: 0.1
max_power: 1
cycle_time: 0.02
stepper: stepper_x, stepper_y, stepper_z
idle_timeout: 60


#####################################################################
#   CPAP
#####################################################################

[fan_generic CPAP]
pin: PA8
cycle_time: 0.05
kick_start_time: 0.5


