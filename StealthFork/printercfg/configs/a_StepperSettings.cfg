#####################################################################
#####################################################################
#   Stepper Settings
#####################################################################
#####################################################################

####################      -------Z1-------      ####################
####################      |              |      ####################
####################      | X(B)    Y(A) |      ####################
####################      |              |      ####################
####################      |              |      ####################
####################      |              |      ####################
####################      Z0------------Z2      ####################
####################           FRONT            ####################


#####################################################################
#   Z0 Stepper MOTOR_3 - Front Left
#####################################################################

[stepper_z]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PE0
endstop_pin: ^EBBCan:PB5
endstop_pin: probe:z_virtual_endstop
homing_retract_dist: 0
rotation_distance: 8
microsteps: 16
full_steps_per_rotation: 200
homing_speed: 8.0 
second_homing_speed: 3
position_max: 135
position_min: -5

[tmc2209 stepper_z]
uart_pin: PB9
run_current: 0.37
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   Z1 Stepper MOTOR_5 - Rear 
#####################################################################

[stepper_z1]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB6
rotation_distance: 8
microsteps: 16
full_steps_per_rotation: 200

[tmc2209 stepper_z1]
uart_pin: PB5
run_current: 0.4
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   Z2 Stepper MOTOR_6 - Front Right
#####################################################################

[stepper_z2]
step_pin: PG13
dir_pin: !PG12
enable_pin: !PG15
rotation_distance: 8
microsteps: 16
full_steps_per_rotation: 200

[tmc2209 stepper_z2]
uart_pin: PG14
run_current: 0.37 
sense_resistor: 0.110
stealthchop_threshold: 0


#####################################################################
#   X Stepper MOTOR_1 - B Stepper Left
#####################################################################

[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
rotation_distance: 32
microsteps: 16
full_steps_per_rotation:200 
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 185
position_max: 185
homing_speed: 80
homing_retract_dist: 15
homing_retract_speed: 100
second_homing_speed: 60
use_sensorless_homing: True
homing_positive_dir: true
min_home_dist: 60


[tmc2209 stepper_x]
uart_pin: PC13
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin:  ^PF4
home_current: 0.6
driver_SGTHRS: 110

[autotune_tmc stepper_x]
motor: moons-ms14hs5p4150
sg4_thrs: 140

#####################################################################
#   X Stepper MOTOR_2 - A Stepper Right
#####################################################################

[stepper_y]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
rotation_distance: 32
microsteps: 16
full_steps_per_rotation:200  
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: -25
position_endstop: 188
position_max: 188
homing_speed: 80
homing_retract_dist: 50
homing_retract_speed: 100
second_homing_speed: 60
use_sensorless_homing: True
homing_positive_dir: true
min_home_dist: 40


[tmc2209 stepper_y]
uart_pin: PE3
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PF3
home_current: 0.5
driver_SGTHRS: 110

[autotune_tmc stepper_y]
motor: moons-ms14hs5p4150
sg4_thrs: 145